name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [ ci/windows ]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Layout
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          "FZ_PARENT=$parent" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "parent = $parent"

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qt5compat qtserialport qtimageformats'
          cache: true

      - name: Boost 1.85.0 (headers)
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          if (!(Test-Path "$parent/boost_1_85_0")) {
            curl.exe -L --fail -o "$parent/boost.zip" "https://archives.boost.io/release/1.85.0/source/boost_1_85_0.zip"
            if ($LASTEXITCODE -ne 0) { throw "boost download failed" }
            Expand-Archive "$parent/boost.zip" -DestinationPath $parent -Force
          }
          Get-ChildItem "$parent/boost_1_85_0" -Name | Select-Object -First 3

      - name: libgit2 1.7.1
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          git clone --depth 1 --branch v1.7.1 https://github.com/libgit2/libgit2.git "$parent/libgit2-src"
          if ($LASTEXITCODE -ne 0) { throw "libgit2 clone failed" }
          cmake -S "$parent/libgit2-src" -B "$parent/libgit2-build" -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DBUILD_EXAMPLES=OFF -DUSE_SSH=OFF -DUSE_WINHTTP=ON `
            -DCMAKE_INSTALL_PREFIX="$parent/libgit2-1.7.1"
          if ($LASTEXITCODE -ne 0) { throw "libgit2 configure failed" }
          cmake --build "$parent/libgit2-build" --config Release --target INSTALL
          if ($LASTEXITCODE -ne 0) { throw "libgit2 build failed" }
          Get-ChildItem "$parent/libgit2-1.7.1" -Recurse -Include git2.h,git2.lib,git2.dll | ForEach-Object { $_.FullName }

      - name: zlib 1.3.1
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git "$parent/zlib-src"
          if ($LASTEXITCODE -ne 0) { throw "zlib clone failed" }
          cmake -S "$parent/zlib-src" -B "$parent/zlib-build" -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$parent/zlib-1.3.1"
          if ($LASTEXITCODE -ne 0) { throw "zlib configure failed" }
          cmake --build "$parent/zlib-build" --config Release --target INSTALL
          if ($LASTEXITCODE -ne 0) { throw "zlib build failed" }
          Get-ChildItem "$parent/zlib-1.3.1" -Recurse -Include zlib.lib,zlibstatic.lib,zlib.h | ForEach-Object { $_.FullName }

      - name: quazip 1.4
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          $qtver = (& qmake -query QT_VERSION).Trim()
          $zlib = Get-ChildItem "$parent/zlib-1.3.1" -Recurse -Include zlib.lib,zlibstatic.lib | Select-Object -First 1
          Write-Host "qt version = $qtver ; zlib = $($zlib.FullName)"
          git clone --depth 1 --branch v1.4 https://github.com/stachenov/quazip.git "$parent/quazip-src"
          if ($LASTEXITCODE -ne 0) { throw "quazip clone failed" }
          cmake -S "$parent/quazip-src" -B "$parent/quazip-build" -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DQUAZIP_BZIP2=OFF `
            -DZLIB_INCLUDE_DIR="$parent/zlib-1.3.1/include" -DZLIB_LIBRARY="$($zlib.FullName)" `
            -DCMAKE_INSTALL_PREFIX="$parent/quazip-$qtver-1.4intuisphere"
          if ($LASTEXITCODE -ne 0) { throw "quazip configure failed" }
          cmake --build "$parent/quazip-build" --config Release --target INSTALL
          if ($LASTEXITCODE -ne 0) { throw "quazip build failed" }
          Get-ChildItem "$parent/quazip-$qtver-1.4intuisphere" -Recurse -Name | Select-Object -First 25

      - name: svgpp 1.3.1 (headers)
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          git clone --depth 1 https://github.com/svgpp/svgpp.git "$parent/svgpp-1.3.1"
          if ($LASTEXITCODE -ne 0) { throw "svgpp clone failed" }
          Test-Path "$parent/svgpp-1.3.1/include/svgpp"

      - name: Clipper1 6.4.2
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          curl.exe -L --fail -o "$parent/clipper.zip" "https://downloads.sourceforge.net/project/polyclipping/clipper_ver6.4.2.zip"
          if ($LASTEXITCODE -ne 0) { throw "clipper download failed" }
          Expand-Archive "$parent/clipper.zip" -DestinationPath "$parent/clipper" -Force
          $cpp = Get-ChildItem "$parent/clipper" -Recurse -Filter clipper.cpp | Select-Object -First 1
          $dir = $cpp.DirectoryName
          New-Item -ItemType Directory -Force "$parent/Clipper1-6.4.2/include/polyclipping" | Out-Null
          New-Item -ItemType Directory -Force "$parent/Clipper1-6.4.2/lib" | Out-Null
          Copy-Item "$dir/*.hpp" "$parent/Clipper1-6.4.2/include/polyclipping/"
          cl /nologo /c /EHsc /O2 /MD /I "$dir" "$($cpp.FullName)" /Fo"$parent/Clipper1-6.4.2/clipper.obj"
          if ($LASTEXITCODE -ne 0) { throw "clipper compile failed" }
          lib /nologo /OUT:"$parent/Clipper1-6.4.2/lib/polyclipping.lib" "$parent/Clipper1-6.4.2/clipper.obj"
          if ($LASTEXITCODE -ne 0) { throw "clipper lib failed" }
          Get-ChildItem "$parent/Clipper1-6.4.2" -Recurse -Name

      - name: ngspice 42 headers
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          git clone --depth 1 --branch ngspice-42 https://github.com/imr/ngspice.git "$parent/ngspice-src"
          if ($LASTEXITCODE -ne 0) { throw "ngspice clone failed" }
          New-Item -ItemType Directory -Force "$parent/ngspice-42/include" | Out-Null
          if (Test-Path "$parent/ngspice-42/include/ngspice") { Remove-Item -Recurse -Force "$parent/ngspice-42/include/ngspice" }
          Copy-Item "$parent/ngspice-src/src/include/ngspice" "$parent/ngspice-42/include/ngspice" -Recurse
          if (!(Test-Path "$parent/ngspice-42/include/ngspice/sharedspice.h")) { throw "sharedspice.h missing" }
          Get-ChildItem "$parent/ngspice-42/include/ngspice" -Name | Select-Object -First 8

      - name: ngspice.dll (optional, best-effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/lexxmark/winflexbison/releases/latest" -Headers @{ "User-Agent" = "ci" }
          $asset = $rel.assets | Where-Object { $_.name -like "win_flex_bison*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "no winflexbison asset" }
          curl.exe -L --fail -o "$parent/wfb.zip" $asset.browser_download_url
          Expand-Archive "$parent/wfb.zip" -DestinationPath "$parent/flex-bison" -Force
          msbuild "$parent/ngspice-src/visualc/sharedspice.sln" /p:Configuration=Release /p:Platform=x64 /m /nologo
          $dll = Get-ChildItem "$parent/ngspice-src/visualc" -Recurse -Filter ngspice.dll | Select-Object -First 1
          if (-not $dll) { throw "ngspice.dll not produced" }
          New-Item -ItemType Directory -Force "$parent/ngspice-42/lib" | Out-Null
          Copy-Item $dll.FullName "$parent/ngspice-42/lib/ngspice.dll"
          Get-Item "$parent/ngspice-42/lib/ngspice.dll" | Select-Object FullName, Length

      - name: qmake configure
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/ci-logs" | Out-Null
          $parent = $env:FZ_PARENT.Replace('\','/')
          $zlib = (Get-ChildItem "$env:FZ_PARENT/zlib-1.3.1" -Recurse -Include zlib.lib,zlibstatic.lib | Select-Object -First 1).FullName.Replace('\','/')
          qmake phoenix.pro "QMAKE_TARGET.arch=x86_64" "INCLUDEPATH+=$parent/zlib-1.3.1/include" "LIBS+=$zlib" 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/ci-logs/qmake.log"
          if ($LASTEXITCODE -ne 0) { throw "qmake failed" }

      - name: nmake release
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          nmake release 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/ci-logs/nmake.log"
          if ($LASTEXITCODE -ne 0) { throw "nmake failed" }
          Get-ChildItem "$env:FZ_PARENT/release64" -Filter Fritzing.exe

      - name: Package
        shell: pwsh
        run: |
          $parent = $env:FZ_PARENT
          $deploy = "$parent/deploy"
          Remove-Item $deploy -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $deploy | Out-Null
          Copy-Item "$parent/release64/Fritzing.exe" $deploy
          & windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$deploy/Fritzing.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          if (Test-Path "$parent/libgit2-1.7.1/bin/git2.dll") { Copy-Item "$parent/libgit2-1.7.1/bin/git2.dll" $deploy }
          Get-ChildItem "$parent" -Directory -Filter "quazip-*" -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Recurse -Filter "quazip1-qt6.dll" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $deploy }
          }
          # windeployqt only scanned Fritzing.exe, so quazip's own Qt/zlib deps are missing
          if (Test-Path "$env:QT_ROOT_DIR/bin/Qt6Core5Compat.dll") { Copy-Item "$env:QT_ROOT_DIR/bin/Qt6Core5Compat.dll" $deploy }
          Get-ChildItem "$parent/zlib-1.3.1" -Recurse -Include *.dll -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $deploy }
          if (Test-Path "$deploy/quazip1-qt6.dll") { & windeployqt --release --no-translations "$deploy/quazip1-qt6.dll" 2>$null }
          if (Test-Path "$parent/ngspice-42/lib/ngspice.dll") { Copy-Item "$parent/ngspice-42/lib/ngspice.dll" $deploy }
          Copy-Item "$env:GITHUB_WORKSPACE/sketches" $deploy -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE/translations" $deploy -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE/help" $deploy -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE/README.md" $deploy
          Copy-Item "$env:GITHUB_WORKSPACE/INSTALL.txt" $deploy
          Copy-Item "$env:GITHUB_WORKSPACE/LICENSE.GPL3" $deploy
          git clone --depth 1 --branch master https://github.com/fritzing/fritzing-parts.git "$deploy/fritzing-parts"
          if ($LASTEXITCODE -ne 0) { throw "fritzing-parts clone failed" }
          # build parts.db so the shipped app starts clean (best effort, non-fatal)
          $db = "$deploy/fritzing-parts/parts.db"
          Remove-Item "$db*" -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath "$deploy/Fritzing.exe" -ArgumentList @('-pp',"$deploy/fritzing-parts",'-db',$db) -PassThru -WorkingDirectory $deploy
          $deadline = (Get-Date).AddMinutes(20)
          while ((Get-Date) -lt $deadline -and -not $proc.HasExited) { Start-Sleep -Seconds 15; $proc.Refresh() }
          if (-not $proc.HasExited) { $proc.Kill() }
          Write-Host "parts.db built: $(Test-Path $db)"
          # tar (not Compress-Archive) so hidden files like parts .git are kept
          tar.exe -a -c -f "$env:GITHUB_WORKSPACE/fritzing-windows-x64.zip" -C $deploy .
          if ($LASTEXITCODE -ne 0) { throw "tar failed" }
          Get-Item "$env:GITHUB_WORKSPACE/fritzing-windows-x64.zip" | Select-Object FullName, Length

      - name: Upload qmake/nmake logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ github.workspace }}/ci-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Fritzing package
        uses: actions/upload-artifact@v4
        with:
          name: fritzing-windows-x64
          path: ${{ github.workspace }}/fritzing-windows-x64.zip
          retention-days: 14
